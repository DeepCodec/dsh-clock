# dsh-clock bundle patch: inserts the clock plugin row into the profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field); install with `dsh plugin --profile <name> add <npm-or-link>`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (a no-op placeholder here — this plugin is pure UI),
# and the `dsh.client` declaration in package.json makes the browser half
# (exports "./client") load in the web GUI, where it renders the live date &
# time into the composer dock (the bottom status row).
- insert:
    - id: dsh-clock
      name: '@deepcodec/dsh-clock'